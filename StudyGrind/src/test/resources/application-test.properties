# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

app.email.enabled=false
payfast.enabled=false

app.upload.dir=target/test-uploads
app.upload.dir.textbooks=target/test-uploads/textbooks
app.upload.dir.student-cards=target/test-uploads/student-cards

app.jwt.secret=test-secret-key-for-unit-tests-only-min-32-chars
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

logging.level.com.studygrind=DEBUG