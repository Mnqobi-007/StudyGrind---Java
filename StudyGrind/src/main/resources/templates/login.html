<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGrind - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <h1>StudyGrind</h1>
                <p>Your Study Management Platform</p>
            </div>

            <!-- Login Form -->
            <div id="login-section">
                <h2>Login</h2>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required placeholder="Enter your password">
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-me" name="rememberMe">
                            Remember me
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
                </form>
                <p class="switch-text">
                    Don't have an account? <a href="#" onclick="showRegister()">Register here</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="register-section" style="display:none;">
                <h2>Register</h2>
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" name="username" required placeholder="Choose a username">
                    </div>
                    <div class="form-group">
                        <label for="reg-fullname">Full Name</label>
                        <input type="text" id="reg-fullname" name="fullName" required placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" name="email" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" name="password" required placeholder="Create a password" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="reg-confirm-password">Confirm Password</label>
                        <input type="password" id="reg-confirm-password" name="confirmPassword" required placeholder="Confirm your password" minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary" id="register-btn">Register</button>
                </form>
                <p class="switch-text">
                    Already have an account? <a href="#" onclick="showLogin()">Login here</a>
                </p>
            </div>

            <div id="message-box" class="message-box" style="display:none;"></div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        function showRegister() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('register-section').style.display = 'block';
            document.getElementById('message-box').style.display = 'none';
        }

        function showLogin() {
            document.getElementById('register-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('message-box').style.display = 'none';
        }

        function showMessage(message, isError) {
            var box = document.getElementById('message-box');
            box.textContent = message;
            box.style.display = 'block';
            box.className = 'message-box ' + (isError ? 'error' : 'success');
        }

        async function handleLogin(event) {
            event.preventDefault();
            var btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            var data = {
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value,
                rememberMe: document.getElementById('remember-me').checked
            };

            try {
                var response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    var result = await response.json();
                    if (result.success) {
                        var role = result.role || 'student';
                        if (role === 'admin') {
                            window.location.href = '/admin/dashboard';
                        } else if (role === 'teacher') {
                            window.location.href = '/teacher/dashboard';
                        } else {
                            window.location.href = '/student/dashboard';
                        }
                        return;
                    }
                    showMessage(result.message || 'Login failed', true);
                } else {
                    var errorData = await response.json();
                    showMessage(errorData.message || 'Invalid email or password', true);
                }
            } catch (error) {
                showMessage('Connection error. Please try again.', true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            var btn = document.getElementById('register-btn');
            btn.disabled = true;
            btn.textContent = 'Registering...';

            var password = document.getElementById('reg-password').value;
            var confirmPassword = document.getElementById('reg-confirm-password').value;

            if (password !== confirmPassword) {
                showMessage('Passwords do not match', true);
                btn.disabled = false;
                btn.textContent = 'Register';
                return;
            }

            var data = {
                username: document.getElementById('reg-username').value,
                fullName: document.getElementById('reg-fullname').value,
                email: document.getElementById('reg-email').value,
                password: password
            };

            try {
                var response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                var result = await response.json();
                if (result.success) {
                    showMessage('Registration successful! Redirecting...', false);
                    setTimeout(function() {
                        window.location.href = '/student/dashboard';
                    }, 1000);
                } else {
                    showMessage(result.message || 'Registration failed', true);
                    btn.disabled = false;
                    btn.textContent = 'Register';
                }
            } catch (error) {
                showMessage('Connection error. Please try again.', true);
                btn.disabled = false;
                btn.textContent = 'Register';
            }
        }
    </script>
</body>
</html>
