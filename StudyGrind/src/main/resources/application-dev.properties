# Development Configuration
spring.profiles.active=dev

# Server
server.port=8080

# Database (H2 for development)
spring.datasource.url=jdbc:h2:file:./data/studygrind-dev;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.studygrind=DEBUG
logging.level.org.springframework.web=DEBUG

# Email (disabled in dev)
app.email.enabled=false

# PayFast (mock mode)
payfast.enabled=false

# JWT
app.jwt.secret=dev-secret-key-for-testing-only-min-32-chars
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000