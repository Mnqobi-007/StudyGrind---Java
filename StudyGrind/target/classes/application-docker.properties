# Docker Configuration
spring.profiles.active=docker

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://postgres:5432/studygrind
spring.datasource.username=${DB_USERNAME:studygrind}
spring.datasource.password=${DB_PASSWORD:studygrind123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true

# Email (configure via environment variables)
app.email.enabled=${MAIL_ENABLED:false}
app.url=https://studygrind.com

# File uploads
app.upload.dir=/app/uploads

# Logging
logging.file.name=/app/logs/application.log
logging.level.com.studygrind=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# JWT (use environment variable)
app.jwt.secret=${JWT_SECRET}

# PayFast (use environment variables)
payfast.enabled=${PAYFAST_ENABLED:false}
payfast.merchant.id=${PAYFAST_MERCHANT_ID}
payfast.merchant.key=${PAYFAST_MERCHANT_KEY}