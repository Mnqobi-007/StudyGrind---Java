<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGrind | Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/c427389445.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --black: #000000;
            --blue: #3b82f6;
            --yellow: #facc15;
            --white: #ffffff;
            --bg: #f8fafc;
            --text-gray: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0.3;
            }
            25% {
                transform: translateY(-30px) translateX(20px);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-60px) translateX(-10px);
                opacity: 0.4;
            }
            75% {
                transform: translateY(-30px) translateX(-30px);
                opacity: 0.7;
            }
        }

        /* Main container */
        .error-container {
            position: relative;
            z-index: 1;
            background: white;
            border-radius: 40px;
            padding: 60px 80px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo Section */
        .logo {
            margin-bottom: 30px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: var(--black);
            border-radius: 24px;
            margin-bottom: 15px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .logo-icon i {
            font-size: 48px;
            color: var(--yellow);
        }

        .logo h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--black) 0%, var(--blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--text-gray);
            margin-top: 5px;
        }

        /* Error Icon */
        .error-icon {
            margin: 30px 0;
        }

        .error-icon i {
            font-size: 80px;
            color: var(--danger);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-15deg);
            }
            75% {
                transform: rotate(15deg);
            }
        }

        /* Status Code */
        .status-code {
            font-size: 120px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--danger) 0%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 10px;
        }

        /* Message */
        .error-message {
            font-size: 18px;
            color: var(--text-gray);
            margin: 20px 0;
            line-height: 1.6;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn-primary {
            padding: 14px 28px;
            background: var(--black);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background: var(--blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            padding: 14px 28px;
            background: var(--yellow);
            color: var(--black);
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-secondary:hover {
            background: var(--black);
            color: white;
            transform: translateY(-2px);
        }

        /* Help Text */
        .help-text {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-gray);
        }

        .help-text a {
            color: var(--blue);
            text-decoration: none;
        }

        .help-text a:hover {
            text-decoration: underline;
        }

        /* Owl Mascot Animation */
        .owl-mascot {
            position: absolute;
            bottom: 20px;
            left: 20px;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .owl-mascot:hover {
            opacity: 1;
        }

        .owl-mascot i {
            font-size: 60px;
            color: var(--yellow);
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            animation: wiggle 3s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(5deg);
            }
            75% {
                transform: rotate(-5deg);
            }
        }

        @media (max-width: 768px) {
            .error-container {
                padding: 40px 30px;
            }
            .status-code {
                font-size: 80px;
            }
            .action-buttons {
                flex-direction: column;
            }
            .btn-primary, .btn-secondary {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<!-- Animated Background Particles -->
<div class="particles" id="particles"></div>

<!-- Owl Mascot -->
<div class="owl-mascot">
    <i class="fa-solid fa-owl"></i>
</div>

<!-- Main Error Container -->
<div class="error-container">
    <div class="logo">
        <div class="logo-icon">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1>StudyGrind</h1>
        <p>ENGINEERED FOR ACADEMIC GROWTH</p>
    </div>

    <div class="error-icon">
        <i class="fa-solid fa-circle-exclamation"></i>
    </div>

    <div class="status-code" th:text="${statusCode}">404</div>
    
    <h2 th:text="${statusCode == 404 ? 'Page Not Found' : (statusCode == 401 ? 'Unauthorized Access' : (statusCode == 403 ? 'Access Denied' : 'Something Went Wrong'))}">Something Went Wrong</h2>
    
    <div class="error-message" th:text="${errorMessage}">
        The page you're looking for doesn't exist or has been moved.
    </div>

    <div class="action-buttons">
        <a href="/" class="btn-primary">
            <i class="fa-solid fa-house"></i> Back to Home
        </a>
        <a href="javascript:history.back()" class="btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Go Back
        </a>
    </div>

    <div class="help-text">
        <i class="fa-solid fa-headset"></i> Need help? <a href="mailto:support@studygrind.com">Contact Support</a>
    </div>
</div>

<script>
    // Create animated particles
    function createParticles() {
        const container = document.getElementById('particles');
        const particleCount = 50;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 8 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
            container.appendChild(particle);
        }
    }
    
    createParticles();
</script>

</body>
</html>
