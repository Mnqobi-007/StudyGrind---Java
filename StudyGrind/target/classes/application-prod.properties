# Production Configuration
spring.profiles.active=prod

# Server
server.port=8080
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/studygrind
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Flyway
spring.flyway.enabled=true

# Email (production)
app.email.enabled=true
app.url=https://yourdomain.com
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# PayFast (production)
payfast.enabled=true
payfast.testing=false
payfast.merchant.id=${PAYFAST_MERCHANT_ID}
payfast.merchant.key=${PAYFAST_MERCHANT_KEY}
payfast.passphrase=${PAYFAST_PASSPHRASE}

# Logging
logging.level.com.studygrind=INFO
logging.level.org.springframework.web=WARN
logging.file.name=/var/log/studygrind/application.log

# JWT (use strong secret in production)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000