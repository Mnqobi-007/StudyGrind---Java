# ==================== SERVER ====================
server.port=8080
server.servlet.context-path=/
server.error.include-stacktrace=never
server.error.include-message=never
server.error.path=/error

# ==================== DATABASE ====================
spring.datasource.url=jdbc:h2:file:./data/studygrind;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==================== FLYWAY MIGRATION ====================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# ==================== JPA ====================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Lazy loading configuration
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.max_fetch_depth=3
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ==================== H2 CONSOLE ====================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================== JWT ====================
app.jwt.secret=dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWZvci1zdHVkeWdyaW5kLWFwcC1taW4tMzItY2hhcnM=
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ==================== EMAIL CONFIGURATION ====================
app.email.enabled=false
app.url=http://localhost:8080

# ==================== FILE UPLOAD ====================
app.upload.dir=uploads
app.upload.dir.student-cards=uploads/student-cards
app.upload.dir.textbooks=uploads/textbooks
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==================== TRIAL ====================
app.trial.days=14

# ==================== PAYFAST ====================
payfast.enabled=false
payfast.testing=true
payfast.merchant.id=
payfast.merchant.key=
payfast.passphrase=
payfast.return.url=http://localhost:8080/payment/success
payfast.cancel.url=http://localhost:8080/payment/cancel

# ==================== WHATSAPP ====================
app.whatsapp.group.link=https://chat.whatsapp.com/YOUR_GROUP_LINK_HERE

# ==================== ACTUATOR & MONITORING ====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=studygrind
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true

# ==================== LOGGING ====================
logging.level.com.studygrind=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==================== SESSION ====================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

# ==================== STATIC RESOURCES ====================
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.web.resources.cache.period=31536000

# ==================== SPRINGDOC OPENAPI ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.swagger-ui.doc-expansion=none