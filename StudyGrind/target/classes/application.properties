# ==================== SERVER ====================
server.port=8080
server.servlet.context-path=/
server.error.include-stacktrace=never
server.error.include-message=never
server.error.path=/error

# ==================== DATABASE ====================
spring.datasource.url=jdbc:h2:file:./data/studygrind;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==================== FLYWAY MIGRATION ====================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# ==================== JPA ====================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==================== H2 CONSOLE ====================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================== JWT ====================
app.jwt.secret=dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWZvci1zdHVkeWdyaW5kLWFwcC1taW4tMzItY2hhcnM=
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ==================== EMAIL CONFIGURATION ====================
# Set to true to enable real email sending
app.email.enabled=false
app.url=http://localhost:8080

# SMTP Configuration (uncomment and configure for production)
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=${MAIL_USERNAME}
# spring.mail.password=${MAIL_PASSWORD}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# app.email.enabled=true

# ==================== FILE UPLOAD ====================
app.upload.dir=uploads
app.upload.dir.student-cards=uploads/student-cards
app.upload.dir.textbooks=uploads/textbooks
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==================== TRIAL ====================
app.trial.days=14

# ==================== PAYFAST ====================
payfast.enabled=false
payfast.testing=true
payfast.merchant.id=
payfast.merchant.key=
payfast.passphrase=
payfast.return.url=http://localhost:8080/payment/success
payfast.cancel.url=http://localhost:8080/payment/cancel

# ==================== WHATSAPP ====================
app.whatsapp.group.link=https://chat.whatsapp.com/YOUR_GROUP_LINK_HERE

# ==================== LOGGING ====================
logging.level.com.studygrind=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO

# ==================== SESSION ====================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

# ==================== STATIC RESOURCES ====================
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.web.resources.cache.period=31536000