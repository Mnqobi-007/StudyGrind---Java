global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'studygrind'

scrape_configs:
  - job_name: 'studygrind-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'studygrind'
          environment: 'production'

  - job_name: 'node-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          application: 'system'