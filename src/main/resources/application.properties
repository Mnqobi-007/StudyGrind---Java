# application.properties
spring.application.name=studygrind
server.port=8080
server.error.include-message=always

# Database Configuration
spring.datasource.url=jdbc:h2:mem:studygrind;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.settings.trace=false

# File Upload
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=./uploads
app.upload.dir.textbooks=./uploads/textbooks

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Logging
logging.level.com.studygrind=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Disable open-in-view
spring.jpa.open-in-view=false

# Subscription Settings
app.trial.days=14
app.subscription.monthly.price=29.99
app.subscription.monthly.price.cents=2999

# Cache Configuration
spring.cache.type=simple
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=5m

# PayFast Configuration (Optional - leave empty to disable)
payfast.enabled=false
payfast.merchant.id=
payfast.merchant.key=
payfast.passphrase=
payfast.testing=true
payfast.return.url=http://localhost:8080/payment/success
payfast.cancel.url=http://localhost:8080/payment/cancel
payfast.notify.url=http://localhost:8080/api/payfast/notify